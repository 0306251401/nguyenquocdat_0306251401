<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Players</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
if(localStorage.getItem("login")!=="true") location="login.html";
</script>
<h1>Thêm tuyển thủ</h1>
<input id="name" placeholder="Tên">
<input id="role" placeholder="Vai trò">
<input id="img" placeholder="Link ảnh">
<button onclick="add()">Thêm</button>
<script>
function add(){
 let d = JSON.parse(localStorage.getItem("players"))||[];
 d.push({name:name.value, role:role.value, img:img.value});
 localStorage.setItem("players",JSON.stringify(d));
 alert("Đã thêm!");
}
</script>
</body>
</html>
