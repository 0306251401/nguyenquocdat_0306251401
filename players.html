<title>Players</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
<h1 class="title">Đội hình HEAVY</h1>
<div class="players">
<div class="card" onclick="openPlayer('alan')">
<img src="images/alan.jpg">
<h3>Alan</h3>
<p>Bomber</p>
</div>
<div class="card" onclick="openPlayer('dontcry')">
<img src="images/don'tcry.jpg">
<h3>Don't Cry</h3>

</div>
<div class="card" onclick="openPlayer('mufasa')">

<img src="images/khabi.jpg">
<h3>Khabi</h3>

</div>
</div>
<div id="popup" class="popup" onclick="closePopup(event)">
  <div class="popup-content">
    <span class="close" onclick="closePopup()">✖</span>
    <div class="popup-left">
      <img id="p-img" src="">
    </div>
    <div class="popup-right">
      <h2 id="p-name"></h2>
      <span class="badge" id="p-role"></span>
      <p id="p-desc"></p>
      <button class="btn-close" onclick="closePopup()">Đóng</button>
    </div>
  </div>
</div>

        <a href="https://www.facebook.com/share/19vKbQd3Xm/?mibextid=wwXIfr" target="_blank">Facebook</a><br>
        <a href="https://www.tiktok.com/@alann0512" target="_blank">Tiktok</a><br>
        <a href="https://zypage.com/alan0512" target="_blank">Donate</a>
        `
    },
    dontcry:{
        img:"images/popupdon'tcry.png",
        name:"Don't Cry",
        role:"Rusher",
        desc:`
        <h3>Thông tin tuyển thủ</h3>
        <p>Họ và tên: Phạm Duy Bình</p>
        <P>Năm sinh: 2004</p>
        <P>Quê quán: Tp.Hồ Chí Minh</p>
        <P>Mô tả tuyển thủ: Lối chơi tấn công mạnh mẽ, luôn mở combat cho team.</p>
        <a href="https://www.facebook.com/share/1EweXcZQW4/?mibextid=wwXIfr" target="_blank">Facebook</a><br>
        <a href="https://tiktok.com/@dontcry.duybinh" target="_blank">Tiktok</a>
        `
    },
    mufasa:{
        img:"images/popupmufasa.png",
        name:"Mufasa",
        role:"Support",

        <h3>Thông tin tuyển thủ</h3>
        <p>Họ và tên: Phạm Hoàng Việt</p>
        <p>Năm sinh: 2005</p>
        <p>Quê quán: Tp.Hồ Chí Minh</p>
        <p>Mô tả tuyển thủ: Hỗ trợ team cực tốt.</p>
        <a href="https://www.facebook.com/share/1DHKUg4b4Q/?mibextid=wwXIfr" target="_blank">Facebook</a><br>
        <a href="https://tiktok.com/@hvietlee" target="_blank">Tiktok</a>
        `
    },
    bhuy:{
        img:"images/bhuy.jpg",
        name:"B Huy",

        <h3>Thông tin tuyển thủ</h3>

        <p>Mô tả tuyển thủ: Khả năng bắn xa cực chính xác.</p>

        `

        <p>Mô tả tuyển thủ: Thi đấu ổn định, giữ góc tốt.</p>
        <a href="https://www.tiktok.com/@ctuanhihi11" target="_blank">Tiktok</a>

    },
    khabi:{
        img:"images/popupkhabi.jpg",
        name:"Khabi",

        <h3>Thông tin tuyển thủ</h3>

document.getElementById("p-img").src = data[name].img;
document.getElementById("p-name").innerText = data[name].name;
document.getElementById("p-role").innerText = data[name].role;
document.getElementById("p-desc").innerHTML = data[name].desc;
document.getElementById("popup").style.display = "flex";
}
function closePopup(e){
if(!e || e.target.id === "popup"){
document.getElementById("popup").style.display = "none";
}
}
document.addEventListener("keydown", function(e){
if(e.key === "Escape"){
document.getElementById("popup").style.display = "none";
}
});
</script>
</body>
</html>
